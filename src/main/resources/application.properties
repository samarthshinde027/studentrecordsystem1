server.port=${PORT:8080}
server.compression.enabled=true

# Local default: SQLite file. Production: set DB_URL / DB_USER / DB_PASS (PostgreSQL).
spring.datasource.url=${DB_URL:jdbc:sqlite:students.db}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:1}

spring.sql.init.mode=always
spring.jackson.default-property-inclusion=non_null

# Admin login (CHANGE ADMIN_PASS in production) and token signing key
app.admin.user=${ADMIN_USER:admin}
app.admin.pass=${ADMIN_PASS:admin123}
app.auth.secret=${AUTH_SECRET:}
